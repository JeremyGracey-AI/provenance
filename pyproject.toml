[project]
name = "provenance"
version = "0.1.0"
description = "Citation-grounded RAG over textbook page images: retrieve, answer, and verify every claim against the exact page that proves it."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jeremy Gracey" }]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "cohere>=5.13",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Runtime API surface (mirrors root requirements.txt for the Vercel function).
deploy = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "cohere>=5.13",
    "anthropic>=0.40",
]
# Build-time only: PDF render + HF upload. NEVER bundled into the function.
build = [
    "pdf2image>=1.17",
    "pypdf>=4.2",
    "huggingface-hub>=0.24",
]
dev = [
    "pytest>=8.2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
]
